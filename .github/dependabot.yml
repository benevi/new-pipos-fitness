# Actualizaciones automáticas de dependencias (issue #18). Semanales y agrupadas para no
# inundar de PRs; las de seguridad llegan aparte en cuanto se publica el aviso.
# Cada PR pasa por el CI completo (incluido `pnpm audit --prod --audit-level high`).
version: 2
updates:
  # Monorepo pnpm (apps/api y packages/*): un único lockfile en la raíz.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: 'deps'
    groups:
      # Parches y menores de producción juntos. Las mayores van agrupadas en un PR aparte
      # (npm-mayores) que no se mezcla tal cual: cada salto mayor necesita su migración.
      npm-produccion:
        dependency-type: production
        update-types: [minor, patch]
      npm-desarrollo:
        dependency-type: development
        update-types: [minor, patch]
      npm-mayores:
        update-types: [major]

  # App Flutter.
  - package-ecosystem: pub
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels: [dependencies, mobile]
    commit-message:
      prefix: 'deps(mobile)'
    groups:
      pub-menores:
        update-types: [minor, patch]
      pub-mayores:
        update-types: [major]

  # Acciones de GitHub usadas por el CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    labels: [dependencies, ci]
    commit-message:
      prefix: 'deps(ci)'
    groups:
      acciones:
        patterns: ['*']
