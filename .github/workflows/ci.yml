name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (build, lint, typecheck, unit, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pipos
          POSTGRES_PASSWORD: pipos
          POSTGRES_DB: pipos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipos -d pipos_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pipos:pipos@localhost:5432/pipos_e2e
      # Base de datos sombra para `prisma migrate diff` (deriva schema ↔ migraciones).
      DATABASE_URL_SHADOW: postgresql://pipos:pipos@localhost:5432/pipos_shadow
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @pipos/api prisma:generate

      - name: Crear la base de datos sombra
        run: PGPASSWORD=pipos psql -h localhost -U pipos -d pipos_e2e -c 'CREATE DATABASE pipos_shadow'

      - name: Sin deriva entre schema.prisma y migraciones
        run: pnpm --filter @pipos/api prisma:diff

      - name: Build
        run: pnpm build

      - name: Lint (0 warnings)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: OpenAPI al día (contratos → apps/api/openapi.json)
        run: pnpm --filter @pipos/api openapi:check

      - name: Unit tests (cobertura de servicios ≥ 80 %)
        run: pnpm test:ci

      - name: Apply migrations
        run: pnpm --filter @pipos/api prisma:migrate:deploy

      - name: E2E tests (Postgres real)
        run: pnpm test:e2e

  mobile:
    name: Mobile (Flutter analyze, test, APK debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Comprobar versión de Flutter fijada
        run: test "$(python3 -c 'import json;print(json.load(open(".fvmrc"))["flutter"])')" = "3.38.10"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Flutter test
        run: flutter test

      # Integration test «completar una sesión» (CUJ-2) sin emulador: con
      # `-d flutter-tester` corre headless en el mismo motor que `flutter test`
      # (`flutter test integration_test` a secas exige un dispositivo).
      - name: Flutter integration test (headless)
        run: flutter test -d flutter-tester integration_test

      - name: Build APK debug
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:3000

      - uses: actions/upload-artifact@v4
        with:
          name: pipos-fitness-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
