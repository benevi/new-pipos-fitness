name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (build, lint, typecheck, unit, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pipos
          POSTGRES_PASSWORD: pipos
          POSTGRES_DB: pipos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipos -d pipos_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pipos:pipos@localhost:5432/pipos_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @pipos/api prisma:generate

      - name: Build
        run: pnpm build

      - name: Lint (0 warnings)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:ci

      - name: Apply migrations
        run: pnpm --filter @pipos/api prisma:migrate:deploy

      - name: E2E tests (Postgres real)
        run: pnpm test:e2e

  mobile:
    name: Mobile (Flutter analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # La app Flutter se rehace en la Fase 4: hasta entonces este job informa
    # pero no bloquea el merge (su estado actual no es representativo).
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test
