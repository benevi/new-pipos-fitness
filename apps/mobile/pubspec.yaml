name: pipos_fitness
description: Pipos Fitness v1 — plan de fuerza determinista y registro offline-first.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.10 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  path_provider: ^2.1.6
  uuid: ^4.6.0
  connectivity_plus: ^7.3.2
  intl: ^0.20.2
  share_plus: ^10.1.4
  flutter_timezone: ^4.1.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
  # Genera lib/l10n/app_localizations*.dart desde los ARB (también se
  # versionan, para que CI no dependa de la generación).
  generate: true
