# Postgres local para desarrollo y e2e. Uso: docker compose up -d
# Crea tres bases: pipos_dev (desarrollo), pipos_e2e (tests e2e, se vacía) y pipos_shadow
# (base sombra de `prisma migrate diff`).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pipos
      POSTGRES_PASSWORD: pipos
      POSTGRES_DB: pipos_dev
    ports:
      - '5432:5432'
    volumes:
      - pipos-pg:/var/lib/postgresql/data
      - ./scripts/docker/create-databases.sql:/docker-entrypoint-initdb.d/create-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pipos -d pipos_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pipos-pg:
